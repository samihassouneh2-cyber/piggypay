<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PiggyPay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3FF; --card1:#1B1A3A; --card2:#4A3AA8; --ink:#26234A;
  --purple:#6C5CE7; --purple-d:#5546c9; --mint:#00C9A0; --yellow:#FFC857; --pink:#FF6FA0;
  --surface:#FFFFFF; --line:#E7E1FA; --danger:#FF6B6B;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;min-height:100%;}
h1,h2,h3,.brand{font-family:'Baloo 2',sans-serif;}
[dir="rtl"] .flipcard, [dir="rtl"] .row{direction:rtl;}
#app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;}
.brand{font-size:22px;font-weight:800;color:var(--purple-d);display:flex;align-items:center;gap:6px;}
.brand .oink{display:inline-block;transform:rotate(-8deg);}
.pickers{display:flex;gap:6px;}
select.mini{font-family:'Nunito';font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 6px;color:var(--ink);}
.screen{padding:6px 18px 90px;animation:fadeUp .35s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-btn{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;text-align:center;font-family:'Baloo 2';font-size:18px;font-weight:700;color:var(--ink);margin-top:14px;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;box-shadow:0 2px 0 var(--line);}
.card-btn:active{transform:scale(.97);}
.card-btn.primary{background:var(--purple);color:#fff;border:none;box-shadow:0 4px 0 var(--purple-d);}
.card-btn.primary:active{box-shadow:0 1px 0 var(--purple-d);transform:translateY(3px) scale(.99);}
.card-btn.ghost{background:transparent;box-shadow:none;color:var(--purple-d);}
.emoji-big{font-size:54px;text-align:center;margin:18px 0 4px;}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);font-family:'Nunito';font-size:16px;margin-top:8px;background:#fff;color:var(--ink);}
input:focus,select:focus{outline:none;border-color:var(--purple);}
label{font-weight:700;font-size:13px;color:#69649a;margin-top:12px;display:block;}
.field{margin-bottom:6px;}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.pinpad button{padding:16px;border-radius:14px;border:none;background:#fff;box-shadow:0 2px 0 var(--line);font-family:'Baloo 2';font-size:20px;font-weight:700;color:var(--ink);}
.pinpad button:active{transform:scale(.94);}
.dots{display:flex;justify-content:center;gap:10px;margin:16px 0;}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--purple);}
.dot.filled{background:var(--purple);}
.flipcard{width:100%;aspect-ratio:1.6/1;perspective:1000px;margin-top:14px;}
.flipcard-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer;}
.flipcard.flipped .flipcard-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;padding:20px;color:#fff;background:linear-gradient(135deg,var(--card1),var(--card2) 70%,var(--pink));box-shadow:0 10px 24px rgba(70,50,150,.35);display:flex;flex-direction:column;justify-content:space-between;}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--card2),var(--card1) 70%);}
.face .brandmini{font-family:'Baloo 2';font-weight:800;font-size:15px;opacity:.9;}
.balance{font-family:'Baloo 2';font-size:34px;font-weight:800;}
.balance-label{font-size:11px;opacity:.75;letter-spacing:.5px;}
.cardnum{font-size:16px;letter-spacing:3px;font-family:monospace;}
.stripe{height:34px;background:#1a1a2b;margin:6px -20px;}
.tabs{display:flex;gap:8px;margin:18px 0 10px;background:#EFE9FF;padding:5px;border-radius:14px;}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;color:#7b74ad;}
.tab.active{background:#fff;color:var(--purple-d);box-shadow:0 2px 4px rgba(90,70,200,.15);}
.task{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.task .info{flex:1;min-width:90px;}
.task .price{font-family:'Baloo 2';font-weight:800;color:var(--mint);}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;}
.pill.pending{background:#FFF1D6;color:#B9861B;}
.pill.done{background:#DEFBF3;color:#0E9C7C;}
.pill.rejected{background:#FFE1E1;color:#C23B3B;}
.smallbtn{border:none;background:var(--purple);color:#fff;padding:8px 12px;border-radius:10px;font-weight:700;font-size:13px;}
.smallbtn.approve{background:var(--mint);}
.smallbtn.reject{background:var(--danger);}
.kidchip{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);flex-wrap:wrap;}
.kidchip .actions{display:flex;gap:6px;width:100%;margin-top:8px;}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--pink));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Baloo 2';font-size:18px;flex-shrink:0;}
.qr{width:160px;height:160px;margin:14px auto;background:#fff;border-radius:14px;padding:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
.paycode{text-align:center;font-family:monospace;letter-spacing:2px;font-weight:700;color:var(--purple-d);}
.hist{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.hist .who{font-size:11px;color:#9691c2;}
.hist .amt.pos{color:var(--mint);font-weight:800;}
.hist .amt.neg{color:var(--danger);font-weight:800;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.back-link{color:#7b74ad;font-weight:700;font-size:14px;cursor:pointer;display:inline-block;margin-bottom:6px;}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
.confetti span{position:absolute;top:-20px;font-size:20px;animation:fall 1.4s ease-in forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2;}}
.hidden{display:none!important;}
.hint{font-size:12px;color:#9691c2;margin-top:4px;}
.totals{display:flex;gap:8px;margin-bottom:14px;}
.totalbox{flex:1;background:#fff;border-radius:14px;padding:10px;text-align:center;border:1px solid var(--line);}
.totalbox b{display:block;font-family:'Baloo 2';font-size:18px;}
.scan-modal{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.scan-modal video{width:100%;max-width:440px;}
.scan-modal button{margin-top:16px;padding:12px 26px;border-radius:14px;border:none;background:var(--purple);color:#fff;font-weight:800;font-family:'Baloo 2';font-size:16px;}
</style>
</head>

const CURRENCIES = [
["USD","$"],["EUR","€"],["GBP","£"],["MAD","DH"],["JPY","¥"],["CNY","¥"],["RUB","₽"],["INR","₹"],
["CAD","C$"],["AUD","A$"],["CHF","CHF"],["BRL","R$"],["MXN","MX$"],["AED","AED"],["SAR","SAR"],["EGP","E£"],
["TRY","₺"],["KRW","₩"],["SEK","kr"],["NOK","kr"],["DKK","kr"],["PLN","zł"],["ZAR","R"],["NGN","₦"],
["ARS","AR$"],["CLP","CL$"],["COP","CO$"],["PKR","₨"],["BDT","৳"],["IDR","Rp"],["THB","฿"],["VND","₫"],
["PHP","₱"],["MYR","RM"],["SGD","S$"],["NZD","NZ$"],["ILS","₪"],["HKD","HK$"],["CZK","Kč"],["HUF","Ft"],["UAH","₴"]
];
const AVATAR_COLORS = ["#6C5CE7","#FF6FA0","#00C9A0","#FFC857","#5B8DEF"];

let state = null;
let claudeDb = null;
const DOC_PATH = 'family/main';

function defaultState(){ return { lang:'en', currency:'USD', parent:null, kids:[], route:{screen:'home'} }; }
function loadLocal(){ try{ const raw = localStorage.getItem('piggypay_state'); if(raw) return JSON.parse(raw); }catch(e){} return defaultState(); }

async function boot(){
  document.getElementById('app').innerHTML = `<div class="screen" style="text-align:center;padding-top:120px;"><div class="emoji-big">🐷</div>${T.en.loading}</div>`;
  try{
    if(window.claude && window.claude.use) claudeDb = await window.claude.use('db');
  }catch(e){ claudeDb = null; }
  if(claudeDb){
    try{
      const snap = await claudeDb.doc(DOC_PATH).get();
      const data = snap ? (typeof snap.data === 'function' ? snap.data() : snap.data || snap) : null;
      state = (data && data.parent !== undefined) ? data : (loadLocal().parent ? loadLocal() : defaultState());
    }catch(e){ state = loadLocal(); }
  } else {
    state = loadLocal();
  }
  if(!state.route) state.route = {screen:'home'};
  render();
}
function save(){
  try{ localStorage.setItem('piggypay_state', JSON.stringify(state)); }catch(e){}
  if(claudeDb){ claudeDb.doc(DOC_PATH).set(state).catch(()=>{}); }
}
function t(k){ return (T[state.lang]||T.en)[k] || k; }
function sym(){ const c = CURRENCIES.find(c=>c[0]===state.currency); return c?c[1]:'$'; }
function money(n){ return sym()+Number(n||0).toFixed(2); }
function uid(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1800);
}
function confettiBurst(){
  const el = document.createElement('div'); el.className='confetti';
  const em = ['🎉','✨','💰','🎊','⭐'];
  for(let i=0;i<18;i++){
    const s = document.createElement('span');
    s.textContent = em[i%em.length];
    s.style.left = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*.3)+'s';
    el.appendChild(s);
  }
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1700);
}

let scanStream=null, scanRAF=null;
function openScan(){
  document.getElementById('scanModal').classList.remove('hidden');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
    scanStream = stream;
    const video = document.getElementById('scanVideo');
    video.srcObject = stream;
    scanLoop();
  }).catch(()=>{ toast(t('cameraDenied')); closeScan(); });
}
function scanLoop(){
  const video = document.getElementById('scanVideo');
  const canvas = document.getElementById('scanCanvas');
  if(video.readyState===video.HAVE_ENOUGH_DATA && video.videoWidth){
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const img = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = window.jsQR ? jsQR(img.data, img.width, img.height) : null;
    if(code && code.data){
      const manual = document.getElementById('sendToManual');
      if(manual) manual.value = code.data;
      closeScan();
      toast(code.data);
      return;
    }
  }
  scanRAF = requestAnimationFrame(scanLoop);
}
function closeScan(){
  document.getElementById('scanModal').classList.add('hidden');
  if(scanRAF) cancelAnimationFrame(scanRAF);
  if(scanStream){ scanStream.getTracks().forEach(tr=>tr.stop()); scanStream=null; }
}

function wireScreen(){
  const r = state.route.screen;
  const back = id=>{ const el=document.getElementById(id); if(el) el.onclick=()=>go(r==='parentHome'||r==='kidHome'?'home':'home'); };
  document.getElementById('btnCloseScan').onclick = closeScan;
  if(r==='home'){
    document.getElementById('btnParent').onclick = ()=> go(state.parent?'parentLogin':'parentCreate', {_entered:''});
    document.getElementById('btnKid').onclick = ()=> go('kidPick');
  }
  if(r==='parentCreate'){
    back('btnBack');
    document.getElementById('btnCreate').onclick = ()=>{
      const name = document.getElementById('pName').value.trim();
      const pin = document.getElementById('pPin').value.trim();
      if(!name || !/^\d{4}$/.test(pin)){ toast(t('choosePin')); return; }
      state.parent = {name, pin}; save();
      go('parentHome');
    };
  }
  if(r==='parentLogin'){
    back('btnBack');
    document.getElementById('btnReset').onclick = ()=>{ if(confirm(t('confirmReset'))){ localStorage.removeItem('piggypay_state'); if(claudeDb) claudeDb.doc(DOC_PATH).set(defaultState()).catch(()=>{}); state = defaultState(); render(); } };
    wirePinPad(entered=>{
      if(entered.length<4) return;
      if(entered===state.parent.pin) go('parentHome'); else { toast(t('wrongPin')); go('parentLogin', {_entered:''}); }
    });
  }
  if(r==='parentHome'){
    document.getElementById('btnAddKid') && (document.getElementById('btnAddKid').onclick = ()=> go('addKid'));
    document.getElementById('btnLogout').onclick = ()=> go('home');
    document.querySelectorAll('[data-ptab]').forEach(b=> b.onclick=()=> go('parentHome',{ptab:b.dataset.ptab}));
    document.querySelectorAll('[data-addtask]').forEach(b=> b.onclick = ()=> go('addTask',{kidId:b.dataset.addtask}));
    document.querySelectorAll('[data-give]').forEach(b=> b.onclick = ()=> go('giveMoney',{kidId:b.dataset.give}));
    document.querySelectorAll('[data-approve]').forEach(b=> b.onclick = ()=>{
      const [kidId, taskId] = b.dataset.approve.split(':');
      const k = state.kids.find(x=>x.id===kidId); const task = k.tasks.find(x=>x.id===taskId);
      task.status='approved'; k.balance += task.price;
      addHist(k, {amount:task.price, note:task.title, kind:'task_won'});
      save(); confettiBurst(); toast(t('approved')); render();
    });
    document.querySelectorAll('[data-reject]').forEach(b=> b.onclick = ()=>{
      const [kidId, taskId] = b.dataset.reject.split(':');
      const k = state.kids.find(x=>x.id===kidId); const task = k.tasks.find(x=>x.id===taskId);
      task.status='rejected';
      addHist(k, {amount:0, note:task.title, kind:'task_lost'});
      save(); toast(t('rejectedMsg')); render();
    });
  }
  if(r==='addKid'){
    back('btnBack');
    document.getElementById('btnSaveKid').onclick = ()=>{
      const name = document.getElementById('kName').value.trim();
      const pin = document.getElementById('kPin').value.trim();
      if(!name || !/^\d{4}$/.test(pin)){ toast(t('choosePin')); return; }
      state.kids.push({
        id: uid(), name, pin, balance:0, tasks:[], history:[],
        paycode: '$'+name.replace(/\s/g,'').slice(0,10)+uid().slice(0,3),
        cardNumber: '•••• '+String(Math.floor(1000+Math.random()*9000)),
        color: AVATAR_COLORS[state.kids.length % AVATAR_COLORS.length]
      });
      save(); go('parentHome');
    };
  }
  if(r==='addTask'){
    back('btnBack');
    document.getElementById('btnSaveTask').onclick = ()=>{
      const title = document.getElementById('tTitle').value.trim();
      const price = parseFloat(document.getElementById('tPrice').value);
      if(!title || !(price>=0)){ toast(t('taskTitle')); return; }
      const k = state.kids.find(x=>x.id===state.route.kidId);
      k.tasks.push({id:uid(), title, price, status:'todo'});
      save(); go('parentHome');
    };
  }
  if(r==='giveMoney'){
    back('btnBack');
    document.getElementById('btnGive').onclick = ()=>{
      const amt = parseFloat(document.getElementById('gAmt').value);
      const note = document.getElementById('gNote').value.trim() || t('give');
      if(!(amt>0)){ toast(t('directAmount')); return; }
      const k = state.kids.find(x=>x.id===state.route.kidId);
      k.balance += amt;
      addHist(k, {amount:amt, note, kind:'parent_send'});
      save(); confettiBurst(); toast(t('sent')); go('parentHome');
    };
  }
  if(r==='kidPick'){
    back('btnBack');
    document.querySelectorAll('[data-pick]').forEach(el=> el.onclick=()=> go('kidLogin',{kidId:el.dataset.pick,_entered:''}));
  }
  if(r==='kidLogin'){
    back('btnBack');
    const k = state.kids.find(x=>x.id===state.route.kidId);
    wirePinPad(entered=>{
      if(entered.length<4) return;
      if(entered===k.pin) go('kidHome',{kidId:k.id, tab:'tasks'}); else { toast(t('wrongPin')); go('kidLogin',{kidId:k.id,_entered:''}); }
    });
  }
  if(r==='kidHome'){
    document.getElementById('btnLogout').onclick = ()=> go('home');
    document.getElementById('flip').onclick = function(){ this.classList.toggle('flipped'); };
    document.querySelectorAll('[data-tab]').forEach(el=> el.onclick=()=> go('kidHome',{kidId:state.route.kidId, tab:el.dataset.tab}));
    const k = state.kids.find(x=>x.id===state.route.kidId);
    document.querySelectorAll('[data-done]').forEach(el=> el.onclick=()=>{
      const task = k.tasks.find(x=>x.id===el.dataset.done); task.status='pending'; save(); render();
    });
    const scanBtn = document.getElementById('btnScan');
    if(scanBtn) scanBtn.onclick = openScan;
    const sendBtn = document.getElementById('btnSend');
    if(sendBtn) sendBtn.onclick = ()=>{
      const sel = document.getElementById('sendTo').value;
      const manual = document.getElementById('sendToManual').value.trim();
      const amt = parseFloat(document.getElementById('sendAmt').value);
      const note = document.getElementById('sendNote').value.trim() || '💸';
      let target = sel ? state.kids.find(x=>x.id===sel) : state.kids.find(x=>x.paycode.toLowerCase()===manual.toLowerCase());
      if(!target || target.id===k.id){ toast(t('toWho')); return; }
      if(!(amt>0)){ toast(t('amount')); return; }
      if(amt > k.balance){ toast(t('notEnough')); return; }
      k.balance -= amt; target.balance += amt;
      addHist(k, {amount:-amt, note: note+' → '+target.name, kind:'transfer_out'});
      addHist(target, {amount:amt, note: note+' ← '+k.name, kind:'transfer_in'});
      save(); confettiBurst(); toast(t('sent')); go('kidHome',{kidId:k.id, tab:'history'});
    };
  }
}
function wirePinPad(onSubmit){
  document.querySelectorAll('#pad [data-n]').forEach(btn=>{
    btn.onclick = ()=>{
      let entered = state.route._entered || '';
      const n = btn.dataset.n;
      if(n==='clear') entered = entered.slice(0,-1);
      else if(n==='ok'){ onSubmit(entered); return; }
      else if(entered.length<4) entered += n;
      state.route._entered = entered; save();
      document.getElementById('dots').innerHTML = pinDots(entered);
      if(entered.length===4) setTimeout(()=>onSubmit(entered), 150);
    };
  });
}

boot();
</script>
</body>
</html>
